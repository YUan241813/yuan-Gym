# Release signing for the yuan-Gym APK.
#
# Keep this file and keystore/yuangym-release.jks out of version control, and keep a
# backup of both: Android only accepts an update signed with the SAME key. Lose it and
# every future release has to be a new install (users must uninstall first).
#
# Loaded by app/build.gradle only when it exists, so a clean checkout still builds
# (debug works unsigned, release falls back to unsigned).

storeFile=keystore/yuangym-release.jks
storePassword=yuangym2026
keyAlias=yuangym
keyPassword=yuangym2026

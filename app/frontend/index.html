<!DOCTYPE html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('yuangym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'zh');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    // The boot screen is painted before the bundle runs, so it reads the saved theme here.
    // App.jsx:resolveTheme is the runtime twin of these two lines — keep them saying the same
    // thing. 'system' (and an unset theme) follows the phone; the app's default is dark.
    var t = s.theme;
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    var paint = t === 'light' ? '#f2f2f7' : '#0c0e12';
    // The meta is below this script: set it now if the parser has it, else once it is there.
    var meta = function () {
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', paint);
    };
    meta();
    document.addEventListener('DOMContentLoaded', meta);
  } catch (e) {}
  // Boot watchdog. A chunk this browser cannot parse (1.4.2's regex lookbehind on iOS 15.5 to
  // 16.3) kills the module graph before any of the app runs, and the logo lifted forever. Here,
  // outside the bundle and in plain old syntax, so it still runs then: a script that fails to
  // load or parse, or no app after 10 s, puts the reason and a Reload button where the logo was.
  // English only, as the packs are in the bundle that did not load. lib/boot.js removes #boot
  // (message included) once the app draws, so a slow start that gets there still gets there.
  (function () {
    var shown = false, last = '';
    function fail(title, detail) {
      var b = document.getElementById('boot');
      // Too early for the boot screen (a script in <head>): say it once the page is there.
      if (!b && document.readyState === 'loading') return document.addEventListener('DOMContentLoaded', function () { fail(title, detail); });
      if (shown || !b || b.getAttribute('data-leaving')) return;
      shown = true;
      b.className = 'fail';
      b.removeAttribute('aria-hidden');
      b.setAttribute('role', 'alert');
      b.setAttribute('dir', 'ltr');
      b.innerHTML = '';
      var box = document.createElement('div'), h = document.createElement('p'), p = document.createElement('p');
      h.className = 'h';
      h.textContent = title;
      p.textContent = 'Reloading often helps. If it keeps happening, please send us this:';
      var c = document.createElement('code');
      c.textContent = (detail || 'No error, it just never finished loading.') + ' (' + navigator.userAgent + ')';
      var r = document.createElement('button');
      r.type = 'button';
      r.textContent = 'Reload';
      r.onclick = function () { location.reload(); };
      box.appendChild(h); box.appendChild(p); box.appendChild(c); box.appendChild(r);
      b.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') return fail('yuan-Gym could not start on this browser.', 'Could not load ' + (t.src || 'a script'));
      if (!e || !e.message) return;
      last = e.message + (e.filename ? ' at ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      if (/SyntaxError|Unexpected|Invalid regular expression/i.test(e.message)) fail('yuan-Gym could not start on this browser.', last);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (r) last = String((r && r.message) || r);
    });
    setTimeout(function () {
      fail(last ? 'yuan-Gym could not start on this browser.' : 'yuan-Gym is taking too long to start.', last);
    }, 10000);
  })();
</script>
<title>yuan-Gym</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#0c0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="yuan-Gym">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<!-- The boot screen: painted with the HTML, before any script runs, so the gap between the
     native splash and the first real screen is the app mark landing instead of a black page.
     Same dark as the native splash. lib/boot.js takes it away the moment the app can draw,
     so it never adds a wait; it reads .db's first animation to leave on a clean beat. -->
<style>
  #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#0c0e12;transition:opacity .22s ease-out}
  #boot.out{opacity:0;pointer-events:none}
  #boot .stage{position:relative;display:grid;place-items:center;width:184px;height:184px}
  #boot .glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,.32),rgba(96,165,250,0) 68%);animation:boot-glow 1.25s ease-in-out .75s infinite}
  #boot .db{animation:boot-float 1.25s ease-in-out .75s infinite}
  #boot .mark{display:block;width:112px;height:112px;border-radius:26px;background:#0e2038;box-shadow:0 16px 38px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);animation:boot-in .7s cubic-bezier(.3,.7,.4,1) both}
  /* Light theme (Settings → Look, or Follow the phone). The mark keeps its own navy tile — the
     artwork is drawn on it — so only the page, the glow and the shadow change: on #f2f2f7 a black
     drop shadow reads as dirt, and the blue halo needs to be far fainter to not tint the page. */
  html[data-theme="light"] #boot{background:#f2f2f7}
  html[data-theme="light"] #boot .glow{background:radial-gradient(circle,rgba(10,132,255,.15),rgba(10,132,255,0) 68%)}
  html[data-theme="light"] #boot .mark{background:transparent;box-shadow:0 18px 40px rgba(16,24,40,.22),0 0 0 1px rgba(16,24,40,.06)}
  html[data-theme="light"] #boot.fail div{color:#1c1c1e}
  html[data-theme="light"] #boot.fail code{background:#fff;color:#3a3a3c;border:1px solid rgba(60,60,67,.12)}
  html[data-theme="light"] #boot.fail button{color:#fff;background:#0a84ff}
  @keyframes boot-in{from{opacity:0;transform:scale(.86)}}
  @keyframes boot-float{50%{transform:translateY(-10px)}}
  @keyframes boot-glow{50%{opacity:.5;transform:scale(.9)}}
  #boot.fail{place-items:center;padding:24px}
  #boot.fail div{max-width:340px;font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#e6e8ec;text-align:center}
  #boot.fail .h{font-size:19px;font-weight:600;margin:0 0 8px}
  #boot.fail code{display:block;margin:14px 0 18px;padding:10px;border-radius:10px;background:#1a1d24;color:#a9b0bc;font-size:12px;text-align:left;word-break:break-word;-webkit-user-select:text;user-select:text}
  #boot.fail button{font:inherit;font-weight:600;color:#0c0e12;background:#60a5fa;border:0;border-radius:12px;min-height:44px;padding:0 28px}
  @media (prefers-reduced-motion:reduce){
    #boot .glow{animation:none;opacity:.4}
    #boot .mark{animation:none}
    #boot .db{animation:boot-breathe 1.6s ease-in-out infinite}
    @keyframes boot-breathe{50%{opacity:.55}}
  }
</style>
<div id="boot" aria-hidden="true">
  <div class="stage">
    <div class="glow"></div>
    <div class="db"><img class="mark" src="icon-512.png" alt=""></div>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
